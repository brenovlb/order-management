services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-management-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Data Source=/app/data/orders.db
    volumes:
      - order-data:/app/data

volumes:
  order-data: